<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171713"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>FILM LAB — Vintage Camera</title>
<style>
:root{color-scheme:dark;--bg:#171713;--panel:#24241e;--cream:#f3e9d2;--muted:#a7a08d;--gold:#d5b77a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}main{max-width:550px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.logo{font-family:Georgia,serif;font-size:24px;letter-spacing:3px}.sub{color:var(--muted);font-size:10px;letter-spacing:2px}.camera{position:relative;aspect-ratio:3/4;background:#080807;border:7px solid #35342b;border-radius:10px;overflow:hidden;box-shadow:0 15px 40px #0007}.camera video,.camera canvas{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.camera video{opacity:0;pointer-events:none}.camera canvas{display:block}.camera:after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 60px #0008;border-radius:3px}.top-label{position:absolute;top:14px;left:14px;z-index:2;font-size:11px;letter-spacing:2px;text-shadow:0 1px 4px black}.date{position:absolute;bottom:15px;right:15px;z-index:2;font:13px monospace;color:#f5ad6b;text-shadow:0 1px 3px #000}.empty{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:15px;background:#171713;padding:25px}.empty p{font-size:13px;color:var(--muted);line-height:1.7}.button{border:1px solid #716b57;border-radius:8px;background:#37352a;color:var(--cream);padding:12px 16px;font-weight:600;cursor:pointer}.button:disabled{opacity:.5}.bar{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px}.small{font-size:12px;color:var(--muted)}.filters{display:flex;overflow-x:auto;gap:9px;padding-bottom:10px;scrollbar-width:none}.filter{flex:0 0 auto;border:1px solid #4a4739;border-radius:8px;background:#24241e;color:#c8c0aa;padding:11px 13px;cursor:pointer;font-size:12px}.filter.active{background:#d5b77a;color:#211e17;border-color:#d5b77a;font-weight:700}.strength{display:flex;align-items:center;gap:12px;margin:12px 0}.strength input{flex:1;accent-color:var(--gold)}.controls{display:flex;align-items:center;justify-content:space-around;margin:18px 0 10px}.shutter{width:78px;height:78px;border-radius:50%;border:5px solid var(--cream);background:var(--cream);box-shadow:inset 0 0 0 5px #171713;cursor:pointer}.shutter:disabled{opacity:.4}.round{width:52px;height:52px;border-radius:50%;border:1px solid #68624e;background:#2b2a22;color:var(--cream);font-size:23px;cursor:pointer}.foot{color:var(--muted);font-size:11px;text-align:center;line-height:1.6}.status{min-height:19px;text-align:center;color:#d5b77a;font-size:12px}.modal{position:fixed;inset:0;background:#000e;z-index:10;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modal-inner{width:min(100%,480px);max-height:95dvh;overflow:auto;text-align:center}.modal img{display:block;width:100%;max-height:70dvh;object-fit:contain;border-radius:6px;margin-bottom:12px}.modal-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}a.button{text-decoration:none;display:inline-block}.hidden{display:none!important}
</style></head><body><main><header><div><div class="logo">FILM LAB</div><div class="sub">ANALOG MOMENTS, EVERY DAY</div></div><div class="sub">35 MM · 001</div></header><section class="camera" id="camera"><video id="video" autoplay muted playsinline></video><canvas id="preview"></canvas><div class="top-label">● REC · <span id="filterLabel">CLASSIC</span></div><div class="date" id="dateLabel"></div><div class="empty" id="empty"><div style="font-size:46px">◉</div><strong>YOUR FILM CAMERA</strong><p>카메라 권한을 허용하면<br>빈티지 필름 촬영을 시작할 수 있어요.</p><button class="button" id="start">카메라 시작하기</button></div></section><div class="bar"><strong style="font-size:13px;letter-spacing:1px">FILM STOCK</strong><span class="small">5 FILTERS</span></div><div class="filters" id="filters"></div><div class="strength"><label class="small" for="strength">필터 강도</label><input type="range" id="strength" min="0" max="100" value="80"><span id="strengthValue" class="small">80%</span></div><div class="controls"><button class="round" id="switch" aria-label="카메라 전환" title="카메라 전환">⟳</button><button class="shutter" id="shutter" aria-label="사진 촬영" disabled></button><button class="round" id="help" aria-label="도움말" title="도움말">?</button></div><div class="status" id="status"></div><div class="foot">빛과 색을 담는 작은 필름 카메라 · FILM LAB</div></main><div class="modal" id="modal"><div class="modal-inner"><img id="shot" alt="촬영된 사진"><div class="modal-actions"><button class="button" id="share">사진 공유 / 저장</button><a class="button" id="download" download="film-lab.jpg">파일 다운로드</a><button class="button" id="close">닫기</button></div><p class="small">아이폰은 ‘사진 공유 / 저장’ → ‘이미지 저장’을 선택하세요.</p></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id), video=$('video'), canvas=$('preview'),ctx=canvas.getContext('2d',{alpha:false});
const filters=[{name:'CLASSIC',css:'sepia(.30) saturate(.78) contrast(1.10) brightness(1.04)'},{name:'GOLDEN',css:'sepia(.48) saturate(1.25) contrast(1.08) brightness(1.06)'},{name:'FADED',css:'sepia(.15) saturate(.60) contrast(.83) brightness(1.13)'},{name:'COOL',css:'sepia(.12) hue-rotate(165deg) saturate(.77) contrast(1.09)'},{name:'MONO',css:'grayscale(1) contrast(1.22) brightness(1.04)'}];
let selected=0,stream=null,facing='environment',running=false,raf=0,lastBlob=null,lastUrl=null;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function filterParams(){const t=Number($('strength').value)/100;const [sep,sat,con,bri,hue,gray]={0:[.30,.78,1.10,1.04,0,0],1:[.48,1.25,1.08,1.06,0,0],2:[.15,.60,.83,1.13,0,0],3:[.12,.77,1.09,1,165,0],4:[0,1,1.22,1.04,0,1]}[selected];return {sep:sep*t,sat:1+(sat-1)*t,con:1+(con-1)*t,bri:1+(bri-1)*t,hue:hue*t,gray:gray*t}}
function mixFilter(){const p=filterParams();return `sepia(${p.sep}) saturate(${p.sat}) contrast(${p.con}) brightness(${p.bri}) hue-rotate(${p.hue}deg) grayscale(${p.gray})`}
// iOS Safari는 canvas ctx.filter를 지원하지 않으므로, 지원 여부를 감지해 픽셀 연산으로 대체한다.
const CSS_FILTER=(()=>{try{const t=document.createElement('canvas');t.width=t.height=1;const g=t.getContext('2d');g.filter='grayscale(1)';g.fillStyle='#f00';g.fillRect(0,0,1,1);const d=g.getImageData(0,0,1,1).data;return d[0]===d[1]&&d[1]===d[2]}catch(e){return false}})();
// 3x4 아핀 변환 [r0..r2 계수3개+오프셋] 행렬: out = M·in + off (값 범위 0..1)
const mul=(A,B)=>A.map((r,i)=>[0,1,2].map(j=>r[0]*B[0][j]+r[1]*B[1][j]+r[2]*B[2][j]).concat(r[0]*B[0][3]+r[1]*B[1][3]+r[2]*B[2][3]+r[3]));
function filterMatrix(){const p=filterParams();const a=1-clamp(p.sep,0,1),s=p.sat,g=1-clamp(p.gray,0,1),th=p.hue*Math.PI/180,c=Math.cos(th),n=Math.sin(th);
const sepia=[[.393+.607*a,.769-.769*a,.189-.189*a,0],[.349-.349*a,.686+.314*a,.168-.168*a,0],[.272-.272*a,.534-.534*a,.131+.869*a,0]];
const sat=[[.213+.787*s,.715-.715*s,.072-.072*s,0],[.213-.213*s,.715+.285*s,.072-.072*s,0],[.213-.213*s,.715-.715*s,.072+.928*s,0]];
const con=[[p.con,0,0,.5-.5*p.con],[0,p.con,0,.5-.5*p.con],[0,0,p.con,.5-.5*p.con]];
const bri=[[p.bri,0,0,0],[0,p.bri,0,0],[0,0,p.bri,0]];
const hue=[[.213+c*.787-n*.213,.715-c*.715-n*.715,.072-c*.072+n*.928,0],[.213-c*.213+n*.143,.715+c*.285+n*.140,.072-c*.072-n*.283,0],[.213-c*.213-n*.787,.715-c*.715+n*.715,.072+c*.928+n*.072,0]];
const gray=[[.2126+.7874*g,.7152-.7152*g,.0722-.0722*g,0],[.2126-.2126*g,.7152+.2848*g,.0722-.0722*g,0],[.2126-.2126*g,.7152-.7152*g,.0722+.9278*g,0]];
return [sat,con,bri,hue,gray].reduce((m,x)=>mul(x,m),sepia)}
function applyFilterPixels(c,w,h){const im=c.getImageData(0,0,w,h),d=im.data,m=filterMatrix();const [a0,a1,a2,a3]=m[0],[b0,b1,b2,b3]=m[1],[c0,c1,c2,c3]=m[2];for(let i=0;i<d.length;i+=4){const r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255;d[i]=(a0*r+a1*g+a2*b+a3)*255;d[i+1]=(b0*r+b1*g+b2*b+b3)*255;d[i+2]=(c0*r+c1*g+c2*b+c3)*255}c.putImageData(im,0,0)}
function drawFrame(target,w,h){const c=target.getContext('2d',{alpha:false,willReadFrequently:!CSS_FILTER});c.save();c.fillStyle='#0b0a08';c.fillRect(0,0,w,h);let drawn=false;if(video.readyState>=2){const vw=video.videoWidth,vh=video.videoHeight;const scale=Math.max(w/vw,h/vh),sw=w/scale,sh=h/scale;c.translate(facing==='user'?w:0,0);c.scale(facing==='user'?-1:1,1);if(CSS_FILTER)c.filter=mixFilter();c.drawImage(video,(vw-sw)/2,(vh-sh)/2,sw,sh,0,0,w,h);if(CSS_FILTER)c.filter='none';drawn=true}c.restore();if(drawn&&!CSS_FILTER)applyFilterPixels(c,w,h)}
function render(){if(!running)return;let width=Math.max(1,Math.round(canvas.clientWidth*Math.min(devicePixelRatio||1,CSS_FILTER?2:1))),height=Math.max(1,Math.round(canvas.clientHeight*Math.min(devicePixelRatio||1,CSS_FILTER?2:1)));if(canvas.width!==width||canvas.height!==height){canvas.width=width;canvas.height=height;}drawFrame(canvas,width,height);raf=requestAnimationFrame(render)}
async function startCamera(){if(!navigator.mediaDevices?.getUserMedia){setStatus('HTTPS 또는 localhost에서 실행해 주세요.');return;}stopCamera();$('start').disabled=true;setStatus('카메라 연결 중...');try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1440}}});video.srcObject=stream;await video.play();running=true;$('empty').classList.add('hidden');$('shutter').disabled=false;render();setStatus('');}catch(e){$('empty').classList.remove('hidden');setStatus('카메라 권한을 확인해 주세요: '+(e.name||'오류'));}finally{$('start').disabled=false}}
function stopCamera(){running=false;cancelAnimationFrame(raf);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}video.srcObject=null;$('shutter').disabled=true}
function setStatus(s){$('status').textContent=s}
function dateStamp(){const d=new Date();return `${String(d.getFullYear()).slice(2)}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`}
function addGrain(c,w,h){const g=c.getContext('2d');const noise=document.createElement('canvas');noise.width=180;noise.height=240;const n=noise.getContext('2d');let im=n.createImageData(180,240);for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=Math.random()*35}n.putImageData(im,0,0);g.save();g.globalAlpha=.22;g.drawImage(noise,0,0,w,h);g.restore();}
function stamp(c,w,h){const g=c.getContext('2d');g.save();g.font=`${Math.round(w*.027)}px monospace`;g.textAlign='right';g.fillStyle='#ffb56f';g.shadowColor='#000';g.shadowBlur=3;g.fillText(dateStamp(),w*.955,h*.96);g.restore()}
async function shoot(){if(!running||video.readyState<2)return;const out=document.createElement('canvas');const vw=video.videoWidth,vh=video.videoHeight;const scale=Math.max(1,Math.min(1.6,2200/Math.max(vw,vh)));out.width=Math.max(1,Math.round(vw*scale));out.height=Math.round(out.width*4/3);if(out.height>vh*scale){out.height=Math.round(vh*scale);out.width=Math.round(out.height*3/4)}drawFrame(out,out.width,out.height);addGrain(out,out.width,out.height);stamp(out,out.width,out.height);setStatus('사진 처리 중...');out.toBlob(blob=>{if(!blob){setStatus('사진 생성에 실패했어요.');return}lastBlob=blob;if(lastUrl)URL.revokeObjectURL(lastUrl);lastUrl=URL.createObjectURL(blob);$('shot').src=lastUrl;$('download').href=lastUrl;$('download').download=`film-lab-${Date.now()}.jpg`;$('modal').classList.add('show');setStatus('촬영 완료!')},'image/jpeg',.93)}
async function share(){if(!lastBlob)return;const file=new File([lastBlob],'film-lab.jpg',{type:'image/jpeg'});try{if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'FILM LAB'});return}setStatus('아래 파일 다운로드를 이용해 주세요.')}catch(e){if(e.name!=='AbortError')setStatus('공유 실패: 파일 다운로드를 이용해 주세요.')}}
function buildFilters(){filters.forEach((f,i)=>{const b=document.createElement('button');b.className='filter'+(i===selected?' active':'');b.textContent=f.name;b.onclick=()=>{selected=i;document.querySelectorAll('.filter').forEach((x,j)=>x.classList.toggle('active',j===i));$('filterLabel').textContent=f.name};$('filters').appendChild(b)})}
buildFilters();$('dateLabel').textContent=dateStamp();$('start').onclick=startCamera;$('switch').onclick=()=>{facing=facing==='environment'?'user':'environment';startCamera()};$('shutter').onclick=shoot;$('strength').oninput=e=>$('strengthValue').textContent=e.target.value+'%';$('share').onclick=share;$('close').onclick=()=>$('modal').classList.remove('show');$('help').onclick=()=>alert('1. 카메라 시작 → 권한 허용\n2. 필터 선택 및 강도 조절\n3. 가운데 셔터로 촬영\n4. 사진 공유 / 저장\n\nSafari에서 공유 → 홈 화면에 추가로 설치할 수 있어요.');document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf)}else if(running){render()}});window.addEventListener('pagehide',stopCamera);if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script></body></html>
